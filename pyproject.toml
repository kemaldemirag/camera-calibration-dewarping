[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-calibration-dewarping"
version = "0.1.0"
description = "Traceable perspective-baseline evaluation for single-camera field calibration"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5"]

[project.scripts]
camera-perspective-evaluate = "camera_calibration_dewarping.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

